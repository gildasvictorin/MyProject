<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benvenuto in Benin</title>

    <!-- IL TUO CSS ONLINE VA QUI -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: red;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Benvenuto in questa magnifica nazione</h1>
    <p>MI KWABO LOOO!</p>
    <p>BIENVENU AU BENIN!</p>
    <p>WELCOME IN BENIN!</p>
    <p>BENVENUTO IN BENIN!</p>

    <button id="mioBottone">Cliccami</button>

    <!-- IL TUO JAVASCRIPT ONLINE VA QUI -->
    <script>
        // Seleziona il bottone tramite il suo ID
        const bottone = document.getElementById('mioBottone');

        // Aggiunge un evento al click
        bottone.addEventListener('click', () => {
            alert('Sei nel posto giusto! Alla scoperta del benin.');
        });
    </script>
</body>
</html>

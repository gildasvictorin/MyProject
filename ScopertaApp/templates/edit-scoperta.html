{% include 'layout.html' %}

<div class="container">
    <div class="card">
        <div class="card-header">
            Let's edit your scoperta!
        </div>
        <div class="card-body">
            <form id="editScopertaForm">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" class="form-control" name="title" value="{{scoperta.title}}" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" class="form-control" rows="3" required>{{scoperta.description}}</textarea>
                </div>
                <div class="form-group">
                    <label>Priority</label>
                    <select name="priority" class="form-control">
                        <option {% if scoperta.priority == 1 %} selected="selected"{% endif %}>1</option>
                        <option {% if scoperta.priority == 2 %} selected="selected"{% endif %}>2</option>
                        <option {% if scoperta.priority == 3 %} selected="selected"{% endif %}>3</option>
                        <option {% if scoperta.priority == 4 %} selected="selected"{% endif %}>4</option>
                        <option {% if scoperta.priority == 5 %} selected="selected"{% endif %}>5</option>
                    </select>
                </div>
                <div class="form-group form-check">
                    <input type="checkbox" class="form-check-input" name="complete" {% if scoperta.complete %} checked {% endif %}>
                    <label class="form-check.label">Complete</label>
                </div>
                <button type="submit" class="btn btn-primary">Edit your scoperta</button>
                <button id="deleteButton" type="button" class="btn btn-danger">Delete</button>
                <a href="/scoperta/scoperta-page" class="btn btn-success">Back</a>
            </form>
        </div>
    </div>
</div>
